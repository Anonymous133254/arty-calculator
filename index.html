<!DOCTYPE html>
<html>
<head>
  <title>Artillery Calculator</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #1e1e1e;
      color: white;
    }

    input, select, button {
      padding: 10px;
      margin: 5px;
      font-size: 16px;
    }

    button {
      cursor: pointer;
    }

    #result {
      margin-top: 10px;
      font-size: 20px;
    }

    canvas {
      margin-top: 20px;
      background: #111;
      border: 1px solid #444;
    }
  </style>
</head>
<body>

<h1>Artillery Calculator</h1>

<select id="weapon" onchange="updateButtons()">
  <option value="104">cannon</option>
  <option value="223">howitzer</option>
  <option value="590">mortar 1/4</option>
  <option value="374">mortar 2/4</option>
  <option value="250">mortar 3/4</option>
  <option value="181">mortar 4/4</option>
</select>

<br>

<input id="x" placeholder="Distance">
<input id="y" placeholder="Height">

<br>

<button onclick="calcDirect()">Calculate Direct</button>
<button id="indirectBtn" onclick="calcIndirect()">Calculate Indirect</button>

<div id="result"></div>

<canvas id="graph" width="700" height="350"></canvas>

<script>

function updateButtons() {
  let g = Number(document.getElementById("weapon").value);

  document.getElementById("indirectBtn").style.display =
    (g === 104 || g === 223) ? "none" : "inline-block";
}

function getValues() {
  let g = Number(document.getElementById("weapon").value);
  let x = Number(document.getElementById("x").value);
  let y = Number(document.getElementById("y").value);

  if (!g || !x || y === "" || x < 1) return null;

  return { g, x, y: Number(y) };
}

// 🔥 ONLY CHANGE IS HERE: smaller, cleaner scaling
function drawPath(angleDeg) {

  let canvas = document.getElementById("graph");
  let ctx = canvas.getContext("2d");

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let angle = angleDeg * Math.PI / 180;

  let v = 773;
  let g = 9.81;

  let vx = v * Math.cos(angle);
  let vy = v * Math.sin(angle);

  // ↓↓↓ smaller scale = more compact graph ↓↓↓
  let scale = 0.01;

  let started = false;

  ctx.beginPath();

  for (let t = 0; t < 1000; t += 0.1) {

    let x = vx * t;
    let y = vy * t - 0.5 * g * t * t;

    if (y < 0 && t > 0) break;

    let px = x * scale;
    let py = canvas.height - (y * scale);

    if (!started) {
      ctx.moveTo(px, py);
      started = true;
    } else {
      ctx.lineTo(px, py);
    }
  }

  ctx.strokeStyle = "lime";
  ctx.stroke();
}

function calcDirect() {

  let v = getValues();
  if (!v) return document.getElementById("result").innerHTML = "INVALID";

  let { g, x, y } = v;

  let A = (g * x * x) / (2 * 773 * 773);
  let D = x * x - 4 * A * (A + y);

  if (D < 0) return document.getElementById("result").innerHTML = "INVALID";

  let angle = Math.atan((x - Math.sqrt(D)) / (2 * A)) * 180 / Math.PI;

  document.getElementById("result").innerHTML =
    "Direct: " + angle.toFixed(1) + "°";

  drawPath(angle);
}

function calcIndirect() {

  let v = getValues();
  if (!v) return document.getElementById("result").innerHTML = "INVALID";

  let { g, x, y } = v;

  let A = (g * x * x) / (2 * 773 * 773);
  let D = x * x - 4 * A * (A + y);

  if (D < 0) return document.getElementById("result").innerHTML = "INVALID";

  let angle = Math.atan((x + Math.sqrt(D)) / (2 * A)) * 180 / Math.PI;

  document.getElementById("result").innerHTML =
    "Indirect: " + angle.toFixed(1) + "°";

  drawPath(angle);
}

updateButtons();

</script>

</body>
</html>
